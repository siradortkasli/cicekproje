{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Üye Girişi | Çiçeksepeti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
/* --- Yılbaşı Teması Header Tasarımı --- */
.christmas-header {
    text-align: center;
    padding: 30px 0;
    background: linear-gradient(90deg, #c62828, #2e7d32);
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.christmas-title {
    color: white;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 10px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
/* Başlıktaki süslemeler için parlama animasyonu */
.christmas-decor {
    font-size: 28px;
    animation: sparkle 2.5s infinite alternate;
}

@keyframes sparkle {
    from { opacity: 0.6; transform: scale(1); }
    to { opacity: 1; transform: scale(1.1); }
}
/* --- Genel CSS Sıfırlama ve Temel Ayarlar --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
/* Arkaplan resmi ve başlangıç (Gündüz) modu */
body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,0.65),
            rgba(255,255,255,0.65)
        ),
        url("{% static 'images/ciceksepeti.jpg' %}")
        center / cover no-repeat fixed;
}

/* Gece modu aktif edildiğinde uygulanacak arkaplan */
body.night {
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)),
        url("{% static 'images/ciceksepeti.jpg' %}") center / cover no-repeat fixed;
}

header {
    position: relative;
    background: transparent;
    z-index: 5;
}

        .logo {
            text-align: center;
        }

        .logo img {
            height: 80px;
            width: auto;
        }

        /* --- Giriş/Kayıt Kutusu Tasarımı (Login Box) --- */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .login-box {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    width: 400px;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    overflow: hidden;
}

        /* Sekme (Tab) butonları: Giriş Yap / Üye Ol */
        .tabs {
            display: flex;
            background: #f5f5f5;
        }

        .tabs button {
            flex: 1;
            padding: 14px;
            border: none;
            background: none;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .tabs .active {
            color: #4CAF50;
            border-bottom: 3px solid #4CAF50;
            background: #fff;
        }
        /* Form geçiş animasyonları için konteyner yapısı */
        .form-container {
            width: 200%;
            display: flex;
            transition: transform .4s ease;
        }

        .form-container.slide-left {
            transform: translateX(-50%); /* Üye ol formuna kaydır */
        }

        .form-panel {
            width: 50%;
            padding: 30px;
            opacity: 0;
            transform: translateX(40px);
            transition: .4s;
        }

        .active-panel {
            opacity: 1;
            transform: translateX(0);
        }

        label {
            font-size: 14px;
            margin-top: 15px;
            display: block;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #43a047;
        }

        .error-msg {
            color: red;
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }
/* KAR YAĞIŞI ANİMASYONU */
.snow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 40px 70px, white, transparent),
        radial-gradient(1.5px 1.5px at 90px 40px, white, transparent),
        radial-gradient(1px 1px at 130px 80px, white, transparent),
        radial-gradient(2px 2px at 160px 120px, white, transparent);
    background-size: 200px 200px;
    animation: snow 10s linear infinite;
    z-index: 1;
}

@keyframes snow {
    0% {
        background-position: 0 -200px;
    }
    100% {
        background-position: 0 100vh;
    }
}

#themeToggle {
    background: rgba(0,0,0,0.4);
    border: none;
    font-size: 22px;
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
    color: white;
}



#themeToggle:hover {
    background: rgba(255,255,255,0.35);
}
.header-actions {
    position: absolute;
    top: 20px;
    right: 25px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
}

.header-actions-left {
    position: absolute;
    top: 20px;
    left: 25px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
}

.company-login-btn {
    padding: 10px 20px;
    background: rgba(255,255,255,0.9);
    border: 2px solid #4CAF50;
    border-radius: 25px;
    color: #4CAF50;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

.company-login-btn:hover {
    background: #4CAF50;
    color: white;
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}

.order-track-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s ease;
}

.order-track-btn:hover {
    background: #4CAF50;
    color: white;
    transform: scale(1.05);
}
body.dark .order-track-btn {
    background: rgba(30,30,30,0.9);
    border-color: #444;
    color: #eee;
}

    </style>
</head>

<body>

<div class="snow"></div>

<header class="christmas-header">
<div class="header-actions-left">
        <a href="{% url 'company_login' %}" class="company-login-btn">
            🏢 Firma Girişi
        </a>
    </div>
<div class="header-actions">
        <button id="themeToggle">🌙</button>
    </div>

    <div class="christmas-decor">
        🎄 ✨ 🎁 ❄️ ✨ 🎄
        
    </div>
    <h1 class="christmas-title">Yeni Yıla Mutlulukla Gir 🎅</h1>
</header>


<main class="login-container">
    <div class="login-box">

        <div class="tabs">
            <button class="tab active" data-target="login">Giriş Yap</button>
            <button class="tab" data-target="register">Üye Ol</button>
        </div>

        <div class="form-container">

            <!-- LOGIN -->
            <form class="form-panel active-panel login-form" method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <label>E-posta</label>
                <input type="email" name="email" required>

                <label>Şifre</label>
                <input type="password" name="password" required>

                <button type="submit" class="login-button">Giriş Yap</button>

                {% for msg in messages %}
                    <div class="error-msg">{{ msg }}</div>
                {% endfor %}
            </form>

            <!-- ÜYE -->
            <form class="form-panel register-form" method="POST" action="{% url 'register' %}">
                {% csrf_token %}

                <label>Ad Soyad</label>
                <input type="text" name="username" required>

                <label>E-posta</label>
                <input type="email" name="email" required>

                <label>Şifre</label>
                <input type="password" name="password" required>

                <button type="submit" class="login-button">Üye Ol</button>

                {% for msg in messages %}
                    <div class="error-msg">{{ msg }}</div>
                {% endfor %}
            </form>

        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tabs = document.querySelectorAll('.tab');
    const formContainer = document.querySelector('.form-container');
    const loginForm = document.querySelector('.login-form');
    const registerForm = document.querySelector('.register-form');

    // Sekmeler arası geçişi sağlayan mantık (Tab Switching Logic)
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            if (tab.dataset.target === "register") {
                formContainer.classList.add("slide-left");
                loginForm.classList.remove("active-panel");
                registerForm.classList.add("active-panel");
            } else {
                formContainer.classList.remove("slide-left");
                registerForm.classList.remove("active-panel");
                loginForm.classList.add("active-panel");
            }
        });
    });
});
document.addEventListener("DOMContentLoaded", () => {
    // Gece/Gündüz Modu (Dark Mode) kontrolü
    const toggle = document.getElementById("themeToggle");
    if (!toggle) return;

    toggle.addEventListener("click", () => {
        document.body.classList.toggle("night");
        toggle.textContent =
            document.body.classList.contains("night") ? "☀️" : "🌙";
    });
});


</script>

</body>
</html>
