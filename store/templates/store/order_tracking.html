{% extends "store/base.html" %}
{% block content %}

<style>
.track-box {
    max-width: 700px;
    margin: auto;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
}

.track-step {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.track-step.done {
    color: #2fa54c;
    font-weight: bold;
}

.step-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
}

.track-step.done .step-circle {
    background: #2fa54c;
    color: #fff;
}
</style>

<div class="container mt-5">

    <h2 class="fw-bold mb-4 text-center">📦 Sipariş Takibi</h2>

    <div class="track-box">

        <div class="track-step done">
            <div class="step-circle">✓</div>
            Sipariş Alındı
        </div>

        <div class="track-step done">
            <div class="step-circle">✓</div>
            Hazırlanıyor
        </div>

        <div class="track-step">
            <div class="step-circle">3</div>
            Kargoya Verildi
        </div>

        <div class="track-step">
            <div class="step-circle">4</div>
            Teslim Edildi
        </div>

        <hr>

        <p class="text-muted small">
            Siparişiniz en kısa sürede hazırlanıp teslim edilecektir.
        </p>

        <a href="/" class="btn btn-success w-100 mt-3">
            🏠 Ana Sayfaya Dön
        </a>

    </div>
</div>

{% endblock %}
