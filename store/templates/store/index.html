{% extends "store/base.html" %}

{% block content %}

<!-- ============================================
     ANA SAYFA (INDEX)
     Kullanıcıların ilk gördüğü sayfa, ürün listesi ve banner
     ============================================ -->

<head>
  <!-- Sayfa stilleri: Banner ve ürün kartları için özel tasarım -->
  <style>
    .custom-banner {
    height: 300px;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.custom-banner:hover {
    transform: translateY(-6px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
}

.flower-banner {
    background: linear-gradient(135deg, #7bba7d , #d6a4ff);
}

/* KART İÇERİĞİ */
.banner-content {
    position: absolute;
    bottom: 30px;
    left: 30px;
    right: 30px;
    color: white;
}

.banner-content h3 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
}

.banner-content p {
    font-size: 15px;
    opacity: 0.95;
    line-height: 1.6;
}

/* BUTON */
.banner-btn {
    margin-top: 15px;
    padding: 10px 26px;
    border-radius: 30px;
    background: rgba(255,255,255,0.92);
    color: #4b4b4b;
    font-weight: 600;
    border: none;
    transition: all 0.25s ease;
}

.banner-btn:hover {
    background: white;
    transform: scale(1.05);
    color: #5f5cff;
}
html {
    scroll-behavior: smooth;
}

/* Ürünler başlığı biraz aşağıdan gelsin */
#urunler {
    scroll-margin-top: 120px;
}

  </style>
</head>

<!-- ============================================
     BANNER BÖLÜMÜ
     Promosyon ve tanıtım için görsel banner
     ============================================ -->
<div class="row g-4 mb-5">
    <!-- Çiçekler banner: Ana sayfa tanıtım banner'ı -->
    <div class="col-md-6">
        <div class="custom-banner flower-banner">
            <div class="banner-content">
                <h3>Çiçeklerle Mutluluk</h3>
                <p>
                    Bir çiçek bazen bin kelimeden daha fazlasını anlatır.
                    En taze çiçeklerle duygularını hemen ifade et.
                </p>
                <!-- Ürünler bölümüne yumuşak kaydırma ile yönlendirme -->
                <a href="#urunler" class="btn banner-btn">
                    Hemen Gör 🌸
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ============================================
     ÜRÜN LİSTESİ BÖLÜMÜ
     API'den gelen ürünlerin gösterildiği alan
     ============================================ -->
<h2 class="mb-4 text-center text-success fw-bold" id="urunler">💐 Fırsat Ürünleri ve Çiçekler</h2>

<!-- Ürün listesi container: JavaScript ile dinamik olarak doldurulur -->
<div class="row mt-4" id="product-list"></div>

<!-- ============================================
     JAVASCRIPT: ÜRÜN YÜKLEME VE GÖSTERME
     API'den ürünleri çekip sayfaya render eder
     ============================================ -->
<script>
// Ürün yükleme fonksiyonu: Arama metni ve kategori ID'sine göre filtreler
window.loadProducts = function(searchValue = "", categoryId = "") {
  // API URL'ini oluştur: Arama ve kategori parametrelerini ekle
  let url = `/api/products/?q=${searchValue}&category=${categoryId}`;

  // API'den ürünleri çek
  fetch(url)
    .then(res => res.json())
    .then(data => {
      let html = "";

      // Ürün yoksa uyarı mesajı göster
      if (data.length === 0) {
        html = `<div class="alert alert-warning text-center">Ürün bulunamadı.</div>`;
      }

      // Her ürün için kart HTML'i oluştur
      data.forEach(product => {
        const imageUrl = product.image_url ? product.image_url : "https://via.placeholder.com/300x250";

        html += `
          <div class="col-6 col-md-3 mb-4">
            <div class="card h-100 shadow-sm border-0">
              <!-- Ürün görseli: Sabit yükseklikte görsel -->
              <img src="${imageUrl}" class="card-img-top" style="height:250px; object-fit:cover;">
              <div class="card-body text-center">
                <!-- Firma adı: Varsa gösterilir -->
                ${product.company_name ? `<small class="text-muted d-block mb-1">🏢 ${product.company_name}</small>` : ''}
                <!-- Ürün adı -->
                <h6 class="fw-bold">${product.name}</h6>
                <!-- Ürün fiyatı: Kırmızı renkte vurgulanmış -->
                <p class="text-danger fw-bold">${product.price} TL</p>
                <!-- Ürün detay sayfasına yönlendirme butonu -->
                <a href="/urun/${product.id}/" class="btn btn-success w-100">İncele</a>
              </div>
            </div>
          </div>
        `;
      });

      // Oluşturulan HTML'i sayfaya ekle
      document.getElementById("product-list").innerHTML = html;
    });
}

// Sayfa yüklendiğinde tüm ürünleri yükle
loadProducts();

// Arama input'u event listener: Kullanıcı yazdıkça ürünleri filtreler
const input = document.getElementById("searchInput");

if (input) {  // Input varsa event listener ekle
  input.addEventListener("keyup", function () {
    loadProducts(this.value, selectedCategory);
  });
}

// URL parametrelerinden arama ve kategori bilgilerini al
// Eğer URL'de arama veya kategori varsa, o parametrelere göre yükle
const params = new URLSearchParams(window.location.search);
const q = params.get("q") || "";
const categoryFromUrl = params.get("category") || "";

if (q || categoryFromUrl) {
  // URL'den gelen parametrelere göre ürünleri yükle
  selectedCategory = categoryFromUrl;
  loadProducts(q, categoryFromUrl);
} else {
  // Parametre yoksa tüm ürünleri yükle
  loadProducts();
}

</script>



{% endblock %}
