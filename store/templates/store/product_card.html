{% extends "store/base.html" %}


{% block content %}

<h2 class="mb-4 fw-bold">Ürünleri İncele</h2>

<div class="row" id="product-list">
    <!-- Ürünler API’den buraya gelecek -->
</div>

<script>

// Sayfa açılınca yükle
document.addEventListener("DOMContentLoaded", function () {
    loadProducts();
});

// Bu fonksiyonu base.html de çağırıyor!
window.loadProducts = function(searchText = "", categoryId = "") {
    let url = "/api/products/";

    if (searchText || categoryId) {
        url += "?";
        if (searchText) url += "q=" + searchText + "&";
        if (categoryId) url += "category=" + categoryId;
    }

    fetch(url)
        .then(res => res.json())
        .then(products => {
            let html = "";

            products.forEach(p => {
                html += `
                <div class="col-md-3 mb-4">
                    <div class="card h-100 shadow-sm product-card">

                        <img src="${p.image_url ?? 'https://via.placeholder.com/300x300'}"
                             class="card-img-top" alt="${p.name}">
                        
                        <div class="card-body">
                            <h5 class="card-title">${p.name}</h5>
                            <p class="text-success fw-bold">${p.price} TL</p>

                           <a href="/urun/${p.id}/"
   class="btn btn-success w-100">
   İncele
</a>

                        </div>
                    </div>
                </div>
                `;
            });

            document.getElementById("product-list").innerHTML = html;
        });
}

</script>

{% endblock %}
