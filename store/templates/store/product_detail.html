{% extends "store/base.html" %}
{% block content %}

<style>

    #reviewsArea p {
        font-size: 15px;
    }

.product-left-box img {
    width: 100%;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.img-thumb {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    border: 1px solid #ddd;
    cursor: pointer;
}

.price {
    font-size: 32px;
    font-weight: bold;
    color: #2fa54c;
}

.select-box {
    border: 1px solid #ddd;
    background: #fafafa;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 7px;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

.order-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #2fa54c;
    font-weight: bold;
    font-size: 22px;
    color: white;
}

.cart-button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #2fa54c;
    font-weight: bold;
    font-size: 20px;
    background: white;
    margin-top: 5px;
}

</style>


<div class="container mt-4">
    <div id="productDetailArea"></div>
</div>

<input type="number" id="qty" value="1">
<button onclick="addToCart(5)"> Sepete Ekle </button>

<button onclick="window.location.href='/cart/'">Sepete Git</button>
<button onclick="window.location.href='/payment/'">Sipariş Ver</button>

<script>

document.addEventListener("DOMContentLoaded", function () {
    let productId = window.location.pathname.split("/")[2];
    loadProduct(productId);
    loadCities();
});


function loadCities() {
    fetch("/api/cities/")
        .then(res => res.json())
        .then(data => {
            window.cityList = data.cities;
        });
}


function loadProduct(id) {

    fetch(`/api/product/${id}/`)
        .then(res => res.json())
        .then(p => {

            document.getElementById("productDetailArea").innerHTML = `

                <div class="row">

                    <div class="col-md-6 product-left-box">
                        <img src="${p.image_url}" id="mainImage">
                    </div>

                    <div class="col-md-6">

                        <h3 class="fw-bold">${p.name}</h3>
                        <p class="price">${p.price} TL</p>

                        <label class="mt-2">Gönderim Şehri:</label>
                        <select id="citySelect" class="form-control"></select>

                        <label class="mt-2">Teslim Tarihi:</label>
                        <select id="dateSelect" class="form-control">
                            <option value="Bugün">Bugün</option>
                            <option value="Yarın">Yarın</option>
                            <option value="Çarşamba">Çarşamba</option>
                            <option value="Takvim">Takvim</option>
                        </select>

                        <label class="mt-2">Adet:</label>
                        <select id="qtySelect" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>

                        <button onclick="orderProduct(${p.id})" class="order-button mt-4">Sipariş Ver</button>

                        <button onclick="addToCart(${p.id}, ${p.price})" class="cart-button">Sepete Ekle</button>

                        <button onclick="window.location='/sepet/'" class="cart-button">Sepete Git</button>

                    </div>

                </div>

                <hr class="mt-4">

                <div class="mt-4">
                    <h4>Yorumlar</h4>
                    <div id="reviewsArea">Yükleniyor...</div>
                </div>

            `;

            loadReviews(id);

            /// Şehir seçimi dinamik doldur
            let citySelect = document.getElementById("citySelect");
            window.cityList.forEach(city => {
                citySelect.innerHTML += `<option value="${city}">${city}</option>`;
            });

        });
}


// ✔ API'den yorum çekme
function loadReviews(productId) {
    fetch(`/api/product/${productId}/reviews/`)
        .then(res => res.json())
        .then(data => {
            let html = "";
            if (data.length === 0) {
                html = `<p>Henüz yorum yok.</p>`;
            } else {
                data.forEach(r => {
                    html += `
                        <div class="border p-2 rounded mb-2">
                            <strong>${r.username}</strong>
                            <p>${r.comment}</p>
                        </div>
                    `;
                });
            }
            document.getElementById("reviewsArea").innerHTML = html;
        });
}


// ✔ Sepete API ile ekleme
function addToCart(id, price) {

    let item = {
        product_id: id,
        quantity: document.getElementById("qtySelect").value,
        delivery_date: document.getElementById("dateSelect").value,
        city: document.getElementById("citySelect").value
    };

    fetch("/api/cart/add/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(item)
    })
    .then(r => r.json())
    .then(d => {
        alert("Sepete eklendi!");
    });
}


// ✔ Siparişi anında yönlendirme
function orderProduct(id) {

    let orderData = {
        product_id: id,
        quantity: document.getElementById("qtySelect").value
    };

    fetch("/api/order/checkout/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(orderData)
    })
    .then(res => res.json())
    .then(data => {
        window.location = data.payment_url;  // ödeme sayfasına gider
    });
}
fetch("http://127.0.0.1:8000/cities/")
        .then(res => res.json())
        .then(data => {
            const citySelect = document.getElementById("citySelect");

            data.forEach(city => {
                const option = document.createElement("option");
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
        });

        function addToCart(product_id) {
    let qty = document.getElementById('qty').value;

    fetch("http://127.0.0.1:8000/cart/add/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            product_id: product_id,
            quantity: qty
        })
    }).then(res => res.json())
    .then(data => {
        alert(data.message)
    });
}
</script>


{% endblock %}
