<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firma Kayıt - ÇiçekSepeti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-box {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2 class="text-center mb-4">🏢 Firma Kayıt</h2>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        <div class="text-center mt-3">
            <a href="{% url 'company_login' %}" class="btn btn-primary">Giriş Sayfasına Git</a>
        </div>
        {% else %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Kullanıcı Adı *</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">E-posta *</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Şifre *</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Firma Adı *</label>
                <input type="text" name="company_name" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Firma Açıklaması</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            
            <div class="alert alert-info">
                <small>⚠️ Kayıt sonrası admin onayı gereklidir. Onaylandıktan sonra giriş yapabilirsiniz.</small>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Kayıt Ol</button>
            
            <div class="text-center mt-3">
                <a href="{% url 'company_login' %}">Zaten hesabınız var mı? Giriş yapın</a>
            </div>
        </form>
        {% endif %}
    </div>
</body>
</html>
