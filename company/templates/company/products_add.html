{% extends "company/cbase.html" %}
{% block content %}

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Yeni Ürün Ekle</h3>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Ürün Adı *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Açıklama</label>
                            <textarea name="description" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fiyat (TL) *</label>
                                <input type="number" name="price" step="0.01" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stok</label>
                                <input type="number" name="stock" class="form-control" value="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Kategori</label>
                            <select name="category" class="form-select">
                                <option value="">Kategori Seçin</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ürün Görsel URL</label>
                            <input type="url" name="image_url" class="form-control" 
                                   placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="has_video" class="form-check-input" id="has_video">
                                <label class="form-check-label" for="has_video">
                                    Video var
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_premium" class="form-check-input" id="is_premium">
                                <label class="form-check-label" for="is_premium">
                                    Premium ürün
                                </label>
                            </div>
                        </div>

                        <div class="alert alert-info">
                            <small>⚠️ Ürününüz admin onayından sonra sitede görünecektir.</small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Ürünü Ekle</button>
                            <a href="{% url 'company_products' %}" class="btn btn-secondary">İptal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
