{% extends "company/cbase.html" %}
{% block content %}

<!-- ============================================
     ÜRÜN DÜZENLEME SAYFASI
     Firma panelinde mevcut ürün bilgilerini güncelleme sayfası
     ============================================ -->

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Ürünü Düzenle</h3>
                </div>
                <div class="card-body">
                    <!-- Hata mesajı gösterimi: Form validasyon hataları -->
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <!-- Ürün düzenleme formu: POST metodu ile ürün bilgilerini günceller -->
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Ürün adı: Zorunlu alan, mevcut ürün adını gösterir -->
                        <div class="mb-3">
                            <label class="form-label">Ürün Adı *</label>
                            <input type="text" name="name" class="form-control" 
                                   value="{{ product.name }}" required>
                        </div>

                        <!-- Ürün açıklaması: Detaylı ürün bilgisi -->
                        <div class="mb-3">
                            <label class="form-label">Açıklama</label>
                            <textarea name="description" class="form-control" rows="4">{{ product.description }}</textarea>
                        </div>

                        <!-- Fiyat ve stok bilgileri: Yan yana iki sütun -->
                        <div class="row">
                            <!-- Fiyat: Zorunlu alan, ondalık sayı desteği -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fiyat (TL) *</label>
                                <input type="number" name="price" step="0.01" class="form-control" 
                                       value="{{ product.price }}" required>
                            </div>

                            <!-- Stok miktarı: Mevcut stok bilgisi -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stok</label>
                                <input type="number" name="stock" class="form-control" 
                                       value="{{ product.stock }}">
                            </div>
                        </div>

                        <!-- Kategori seçimi: Dropdown menüden kategori seçimi -->
                        <div class="mb-3">
                            <label class="form-label">Kategori</label>
                            <select name="category" class="form-select">
                                <option value="">Kategori Seçin</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}" 
                                        {% if product.category and product.category.id == category.id %}selected{% endif %}>
                                    {{ category.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Ürün görsel URL: Ürün görselinin internet adresi -->
                        <div class="mb-3">
                            <label class="form-label">Ürün Görsel URL</label>
                            <input type="url" name="image_url" class="form-control" 
                                   value="{{ product.image_url }}"
                                   placeholder="https://example.com/image.jpg">
                        </div>

                        <!-- Video var mı: Ürünün video içeriği olup olmadığını belirtir -->
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="has_video" class="form-check-input" id="has_video"
                                       {% if product.has_video %}checked{% endif %}>
                                <label class="form-check-label" for="has_video">
                                    Video var
                                </label>
                            </div>
                        </div>

                        <!-- Premium ürün: Özel ürün işaretleme -->
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_premium" class="form-check-input" id="is_premium"
                                       {% if product.is_premium %}checked{% endif %}>
                                <label class="form-check-label" for="is_premium">
                                    Premium ürün
                                </label>
                            </div>
                        </div>

                        <!-- Uyarı mesajı: Düzenleme sonrası admin onayı gerektiğini bildirir -->
                        <div class="alert alert-warning">
                            <small>⚠️ Ürününüz düzenlendiği için admin onayından sonra sitede görünecektir.</small>
                        </div>

                        <!-- Form butonları: Kaydet ve İptal -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Değişiklikleri Kaydet</button>
                            <a href="{% url 'company_products' %}" class="btn btn-secondary">İptal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
